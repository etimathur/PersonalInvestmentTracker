<section class="dashboard-page" aria-labelledby="dashboard-title">
  <div class="page-heading">
    <div>
      <p class="eyebrow">Overview</p>
      <h1 id="dashboard-title">Your dashboard</h1>
      <p class="page-description">A snapshot of your systematic investments.</p>
    </div>
  </div>
  <div class="summary-card" aria-label="Investment summary">
    <article class="summary-item">
      <h2>Total Invested</h2>
      <p>{{ totalInvestment() | currency:'INR' }}</p>
    </article>
    <article class="summary-item">
      <h2>Current Value</h2>
      <p>{{ currentValue() | currency:'INR' }}</p>
    </article>
    <article class="summary-item">
      <h2>Profit/Loss</h2>
      <p>{{ profitLoss() | currency:'INR' }}</p>
    </article>
    <article class="summary-item">
      <h2>Returns</h2>
      <p>{{ profitLossPercentage() | number:'1.2-2' }}%</p>
    </article>
  </div>
</section>
